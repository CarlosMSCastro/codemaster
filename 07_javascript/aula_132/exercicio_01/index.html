<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 131.3</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <h1>Javascript</h1>

  <div class="caixa">
    <h3>Formulário</h3><br>
    <form onsubmit="registar(event)">
      <input type="text" id="nome" required autofocus placeholder="Nome"><br><br>
      <input type="number" id="idade" required placeholder="Idade"><br><br>
      <input type="Morada" id="morada" required placeholder="Morada"><br><br>
      <button>Registar</button>
    </form>
  </div>

  <div class="caixa">
    <table id="tabela">
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Morada</th>
      </tr>
    </table>
  </div>
</body>
</html>
