<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 135.3</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <h1>Javascript</h1>

  <div class="caixa">
    <h3>Formulário</h3>
    <br>
    <form action="" onsubmit="enviar(event)" id="formulario">
      <input type="number" name="inicio_input" id="inicio_input" required autofocus placeholder="Número Inicial">
      <input type="number" name="final_input" required placeholder="Número Final">
      <br><br>
      <input type="number" name="tempo_input" required placeholder="Tempo (s)" min="0" step="any">
      <br><br>
      <input type="submit" value="Enviar">
    </form>
  </div>

  <div class="caixa">
    <h3>Saída</h3>
    <div id="saida"></div>
  </div>

</body>
</html>
