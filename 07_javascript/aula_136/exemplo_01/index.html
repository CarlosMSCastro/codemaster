<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo1</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <h1>Javascript</h1>

  <form action="" class="caixa" id="formulario">
    <h3>Formulário</h3>
    <br><br>
    <input type="number" id="num_inicial" placeholder="Número Inicial" required autofocus>
    <input type="number" id="num_final" placeholder="Número Final" required>
    <br><br>
    <input type="number" id="tempo" placeholder="Tempo (s)" required>
    <br><br>
    <button type="button" onclick="gerar_nums(event)">Enviar</button>
  </form>

  <div class="caixa d-none" id="saida">
    <h3>Saída</h3>
  </div>

</body>
</html>
