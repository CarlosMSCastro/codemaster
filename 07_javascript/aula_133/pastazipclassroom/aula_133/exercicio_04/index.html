<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 133.4</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <h1>Javascript</h1>

  <div class="caixa">
    <form action="" onsubmit="registar(event)" id="formulario">
      <input type="text" name="nome" required autofocus placeholder="Nome" id="nome_input">
      <br><br>
      <input type="number" name="idade" required min="0" placeholder="Idade">
      <br><br>
      <input type="text" name="morada" required placeholder="Morada">
      <br><br>
      <input type="text" name="nif" required placeholder="NIF">
      <br><br>
      <input type="submit" value="Registar">
    </form>
  </div>

  <div class="caixa">
    <table id="tabela">
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Morada</th>
        <th>NIF</th>
      </tr>
    </table>
  </div>

</body>
</html>
