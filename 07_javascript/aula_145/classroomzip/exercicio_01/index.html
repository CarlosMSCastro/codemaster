<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 145.1</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/classes/Produto.js" defer></script>
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <h1>Javascript</h1>

  <div class="caixa">
    <form action="" onsubmit="registar(event)" id="formulario">
      <input type="text" id="input_nome" required autofocus placeholder="Nome">
      <br><br>
      <input type="number" id="input_preco" step="0.01" min="0.01" required placeholder="Preço">
      <br><br>
      <input type="number" id="input_stock" min="0" required placeholder="Stock">
      <br><br>
      <input type="submit" value="Registar">
    </form>
  </div>

  <div class="caixa" id="saida">

    <table id="tabela">
      <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Stock</th>
      </tr>
    </table>

  </div>

</body>
</html>
