<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 135.3</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funcoes.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <h1>Javascript</h1>

  <form class="caixa" onsubmit="enviar(event)" id="formulario">
    <h3>Formulário</h3>
    <br>
    <input type="text" name="texto" id="texto_input" required placeholder="Texto">
    <br><br>
    <input type="number" name="tempo" id="tempo_input" step="any" min="0" required placeholder="Tempo (s)">
    <br><br>
    <input type="submit" value="Enviar">
  </form>

</body>
</html>
